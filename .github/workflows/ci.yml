name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Classifier evaluation
        run: python evals/run_eval.py --cwd .
      - name: Compile
        run: python -m compileall skill_gate
      - name: Validate plugin manifest JSON
        run: python -c "import json; json.load(open('.codex-plugin/plugin.json', encoding='utf-8'))"
      - name: Smoke classification
        run: python -m skill_gate classify "Fix the Python bug in this function"

